name: Exécution Scripts Python

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Récupérer le code
        uses: actions/checkout@v3
      - name: 2. Installer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: 3. Installer les dépendances
        run: |
          pip install pandas pymongo
      - name: 4. Lancer le script Python
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: python mon_script_batch.py
